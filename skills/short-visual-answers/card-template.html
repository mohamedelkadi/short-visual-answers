<!doctype html><html><head><meta charset="utf-8"><style>
/* Copy this file, edit the text, render with scripts/card.sh. Keep under ~40 words total. */
body{margin:0;width:1200px;height:675px;font-family:-apple-system,"SF Pro Display","Segoe UI",Tahoma,sans-serif;background:#fff;color:#1a1a1a;display:flex;flex-direction:column;padding:48px 56px;box-sizing:border-box}
h1{font-size:40px;margin:0 0 8px}
.sub{font-size:22px;color:#666;margin-bottom:36px}
.flow{display:flex;align-items:center;gap:18px;flex:1}
.step{flex:1;border-radius:16px;padding:24px;font-size:24px;line-height:1.3;border:3px solid #d0d7de;background:#f6f8fa;text-align:center}
.ok{border-color:#2da44e;background:#e9f7ee}
.bad{border-color:#cf222e;background:#fdecee;font-weight:600}
.arrow{font-size:36px;color:#999}
.tag{display:block;font-size:16px;font-weight:700;letter-spacing:.06em;margin-bottom:8px;color:#666}
.ok .tag{color:#2da44e}.bad .tag{color:#cf222e}
.foot{font-size:24px;margin-top:28px;padding:18px 22px;border-left:6px solid #0969da;background:#eef4fd}
</style></head><body>
<h1>Password reset email never arrives</h1>
<div class="sub">Sign-in flow · what happens after "Forgot password"</div>
<div class="flow">
  <div class="step ok"><span class="tag">WORKS</span>User taps "Forgot password"</div><div class="arrow">→</div>
  <div class="step ok"><span class="tag">WORKS</span>API creates reset token</div><div class="arrow">→</div>
  <div class="step bad"><span class="tag">BREAKS</span>Email job uses expired API key</div><div class="arrow">→</div>
  <div class="step bad"><span class="tag">BREAKS</span>Email never sent → user stuck</div>
</div>
<div class="foot"><b>Fix:</b> rotate the key and alert on send failures.</div>
</body></html>
